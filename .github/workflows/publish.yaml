# scripts/publish.sh does the work so CI and a local DRY_RUN=1 run are the
# same. A failed run publishes nothing, so the previous release stays the
# latest.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - mapread/**
      - cmd/**
      - internal/**
      - scripts/publish.sh
      - .github/workflows/publish.yaml
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      accept_shrink:
        description: Publish even when a population fell below 90% of the latest release
        type: boolean
        default: false
      accept_stale:
        description: Publish an export older than the freshness bounds (needs a reason)
        type: boolean
        default: false
      reason:
        description: Why the freshness bounds are overridden, written to the release notes
        type: string
        default: ""
      export_tag:
        description: The export release to read instead of the latest (an export- tag)
        type: string
        default: ""
      dry_run:
        description: Verify and write the notes, but sign and release nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.4

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write # gh release create
      id-token: write # keyless cosign signature
      actions: write # keepalive below
    steps:
      - name: Check the dispatch inputs
        env:
          ACCEPT_STALE: ${{ inputs.accept_stale == true }}
          STALE_REASON: ${{ inputs.reason }}
        run: |
          printf 'accept_stale: %s\nreason: %s\n' "$ACCEPT_STALE" "$STALE_REASON"
          if [ "$ACCEPT_STALE" = true ] && [ -z "$(printf '%s' "$STALE_REASON" | tr -d '[:space:]')" ]; then
            echo "::error::accept_stale needs a reason"
            exit 1
          fi
      # GitHub disables a scheduled workflow after 60 days without repository
      # activity, and cron runs do not count. This repository can go that long
      # without a commit, so each run re-enables the workflow.
      - name: Keepalive (reset the 60-day scheduled-workflow timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yaml/enable"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Download the export
        env:
          ANIMAP_EXPORT_TOKEN: ${{ secrets.ANIMAP_EXPORT_TOKEN }}
          EXPORT_TAG: ${{ inputs.export_tag }}
        run: bash scripts/publish.sh download "$RUNNER_TEMP/export"
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPT_SHRINK: ${{ inputs.accept_shrink == true }}
          ACCEPT_STALE: ${{ inputs.accept_stale == true }}
          STALE_REASON: ${{ inputs.reason }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: bash scripts/publish.sh release "$RUNNER_TEMP/export"
