# scripts/drift.sh does the work so CI and a local DRY_RUN=1 run plan the
# same issues.
name: Drift

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # create, edit, reopen and close the animap-labelled issues
      actions: read # gh run list for the publish health check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Restore the HTTP validator cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/http.json
          key: http-${{ github.run_id }}
          restore-keys: http-
      - name: Check drift and the watch set, then apply the issue plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/drift.sh
      - name: Save the HTTP validator cache
        if: ${{ !cancelled() && hashFiles('.cache/http.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/http.json
          key: http-${{ github.run_id }}
