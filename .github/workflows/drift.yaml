# scripts/drift.sh does the work so CI and a local DRY_RUN=1 run plan the
# same issues.
name: Drift

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-26.04
    # The date check refetches every TVDB series it reads once a week, at
    # one request a second, for at most 90 minutes; docs/date-check.md has
    # the measured duration.
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write # create, edit, reopen and close the animap-labelled issues
      actions: read # gh run list for the publish health check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Restore the HTTP validator cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/http.json
          key: http-${{ github.run_id }}
          restore-keys: http-
      - name: Restore the date check's TVDB layouts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/layouts.json
          key: layouts-${{ github.run_id }}
          restore-keys: layouts-
      # publish.yaml pins the mirror commit, so its hash keys the snapshot.
      - name: Restore the AniDB mirror snapshot
        id: mirror-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mirror
          key: drift-anidb-${{ hashFiles('.github/workflows/publish.yaml', 'internal/anidb/*.go') }}
      - name: Check drift, the watch set and the date check, then apply the issue plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/drift.sh
      - name: Save the HTTP validator cache
        if: ${{ !cancelled() && hashFiles('.cache/http.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/http.json
          key: http-${{ github.run_id }}
      - name: Save the date check's TVDB layouts
        if: ${{ !cancelled() && hashFiles('.cache/layouts.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/layouts.json
          key: layouts-${{ github.run_id }}
      - name: Save the AniDB mirror snapshot
        if: ${{ !cancelled() && steps.mirror-cache.outputs.cache-hit != 'true' && hashFiles('.cache/mirror/*.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mirror
          key: drift-anidb-${{ hashFiles('.github/workflows/publish.yaml', 'internal/anidb/*.go') }}
